<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Property - Ceylon Estate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #333;
        }

        .header {
            background: #176b45;
            color: white;
            padding: 25px 50px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 6px 0 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #176b45;
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #176b45;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #176b45;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0f4f32;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #176b45;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #777;
        }

    </style>

</head>

<body>

<div class="header">
    <h1>Ceylon Estate</h1>
    <p>Property Management System</p>
</div>

<div class="container">

    <div class="form-card">

        <h2>Add New Property</h2>

        <form action="/properties" method="post">

            <label>Property ID</label>
            <input type="number"
                   name="propertyId"
                   placeholder="Enter property ID"
                   required>

            <label>Property Name</label>
            <input type="text"
                   name="propertyName"
                   placeholder="Enter property name"
                   required>

            <label>Location</label>
            <input type="text"
                   name="location"
                   placeholder="Enter location"
                   required>

            <label>Property Type</label>
            <select name="propertyType" required>

                <option value="">Select Type</option>
                <option value="House">House</option>
                <option value="Apartment">Apartment</option>
                <option value="Land">Land</option>
                <option value="Commercial">Commercial</option>

            </select>

            <label>Price (Rs.)</label>
            <input type="number"
                   name="price"
                   step="0.01"
                   placeholder="Enter price"
                   required>

            <label>Status</label>
            <select name="status" required>

                <option value="">Select Status</option>
                <option value="Available">Available</option>
                <option value="Sold">Sold</option>
                <option value="Reserved">Reserved</option>

            </select>

            <button type="submit">
                Add Property
            </button>

        </form>

        <a href="/properties" class="back-link">
            ← Back to Property List
        </a>

    </div>

</div>

<div class="footer">
    © 2026 Ceylon Estate - Property Management System
</div>

</body>

</html>

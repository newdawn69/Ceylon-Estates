<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Project 28</title>
</head>
<body>

    <!-- Hero section: navbar floats on top of this background image -->
    <div style="background-image: url('/images/hero-bg.jpg'); background-size: cover; background-position: center; min-height: 560px; display: flex; flex-direction: column;">

        <div th:replace="~{fragments/layout :: navbar}"></div>
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <div class="d-flex flex-column align-items-center justify-content-center text-center flex-grow-1 text-white px-3"
             style="text-shadow: 0 2px 16px rgba(0,0,0,0.6);">
            <h1 class="display-4 fw-bold" th:text="${appName}">Project 28</h1>
            <p class="lead" style="max-width: 600px;" th:text="#{home.description}">Foundation is running</p>
        </div>

    </div>

    <main class="container" style="max-width: 700px; margin-top: 40px; margin-bottom: 50px;">
        <div class="alert alert-success" th:if="${param.accountDeleted}" th:text="#{home.accountDeleted}"></div>
        <p th:text="#{home.next}"></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Property Management - Ceylon Estate</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #333;
    }

    .header {
      background: #176b45;
      color: white;
      padding: 25px 50px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 35px auto;
    }

    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .top-section h2 {
      margin: 0;
      color: #176b45;
    }

    .add-button {
      background: #176b45;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .add-button:hover {
      background: #0f4f32;
    }

    .table-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #176b45;
      color: white;
      padding: 14px;
      text-align: left;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background: #f1f8f5;
    }

    .edit {
      color: #176b45;
      text-decoration: none;
      font-weight: bold;
    }

    .delete {
      color: #c0392b;
      text-decoration: none;
      font-weight: bold;
    }

    .edit:hover,
    .delete:hover {
      text-decoration: underline;
    }

    .status {
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: #777;
    }

  </style>

</head>

<body>

<div class="header">
  <h1>Ceylon Estate</h1>
  <p>Property Management System</p>
</div>

<div class="container">

  <div class="top-section">

    <h2>Properties</h2>

    <a href="/properties/add" class="add-button">
      + Add New Property
    </a>

  </div>

  <div class="table-container">

    <table>

      <thead>

      <tr>
        <th>ID</th>
        <th>Property Name</th>
        <th>Location</th>
        <th>Type</th>
        <th>Price</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>

      </thead>

      <tbody>

      <tr th:each="property : ${properties}">

        <td th:text="${property.propertyId}"></td>

        <td th:text="${property.propertyName}"></td>

        <td th:text="${property.location}"></td>

        <td th:text="${property.propertyType}"></td>

        <td>
          Rs.
          <span th:text="${#numbers.formatDecimal(property.price, 0, 'COMMA', 2, 'POINT')}"></span>
        </td>

        <td class="status"
            th:text="${property.status}">
        </td>

        <td>

          <a class="edit"
             th:href="@{/properties/edit/{id}(id=${property.propertyId})}">
            Edit
          </a>

          &nbsp; | &nbsp;

          <a class="delete"
             th:href="@{/properties/delete/{id}(id=${property.propertyId})}"
             onclick="return confirm('Are you sure you want to delete this property?');">
            Delete
          </a>

        </td>

      </tr>

      </tbody>

    </table>

  </div>

</div>

<div class="footer">
  © 2026 Ceylon Estate - Property Management System
</div>

</body>

</html>
